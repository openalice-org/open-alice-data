[project]
name = "kth-authors"
version = "0.1.0"
description = "Quantum Corpus: builds a corpus of affiliated quantum papers from OpenAlex metadata."
requires-python = ">=3.13"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "pydantic-settings",
]

[tool.ruff]
extend-exclude = [
    "src/10_report_quantum_core_review.py",
]
